<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GDC 哨兵">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#050912">
  <meta name="format-detection" content="telephone=no">
  <title>GDC 哨兵 · iPad 常亮桌面时钟</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-alert-level="idle">
  <div class="ambient-layer" aria-hidden="true">
    <div class="ambient-orb orb-primary"></div>
    <div class="ambient-orb orb-secondary"></div>
  </div>

  <main id="stage" class="stage" data-configured="false">
    <header class="top-bar">
      <div class="top-left">
        <div id="mqttBadge" class="mini-pill" data-state="unconfigured" title="EMQX WebSocket 链路状态">
          <span class="dot"></span>
          <span id="mqttBadgeText">等待配置连接参数</span>
        </div>
        <div id="wakeBadge" class="mini-pill mini-pill-muted is-hidden" title="屏幕常亮锁状态">
          <span class="dot dot-wake"></span>
          <span id="wakeBadgeText">常亮已启用</span>
        </div>
      </div>

      <div class="top-actions">
        <button id="btnTestBark" class="icon-btn requires-connection" type="button" aria-label="测试 Bark 推送" title="测试 Bark 推送">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="icon-btn-label">测试 Bark</span>
        </button>

        <button id="btnSettings" class="icon-btn" type="button" aria-label="连接设置与日志" title="连接设置与日志">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span class="icon-btn-label">连接设置</span>
        </button>
      </div>
    </header>

    <section class="clock-hero" aria-live="off">
      <div id="dateLine" class="date-line">----年--月--日 · 星期-</div>
      <div class="clock-display" aria-label="当前时间">
        <span id="clockHm" class="clock-hm">--:--</span><span class="clock-colon">:</span><span id="clockSec" class="clock-sec">--</span>
      </div>
    </section>

    <section class="status-strip" aria-label="哨兵状态总览">
      <div id="heartbeatCapsule" class="glass-capsule capsule-heartbeat requires-connection" data-hb-state="waiting">
        <span class="status-lamp" aria-hidden="true"></span>
        <div class="capsule-text">
          <span id="heartbeatLabel" class="capsule-primary">等待公司端心跳</span>
          <span id="heartbeatSub" class="capsule-secondary">距上次心跳 -- 秒</span>
        </div>
      </div>

      <div id="shiftCapsule" class="glass-capsule capsule-shift" data-sentinel="silent">
        <div class="shift-group">
          <span id="todayShiftText" class="capsule-primary">今日：未设置</span>
        </div>
        <span class="capsule-divider requires-connection" aria-hidden="true"></span>
        <div class="sentinel-group requires-connection">
          <span class="sentinel-dot" aria-hidden="true"></span>
          <span id="sentinelStateText" class="capsule-secondary">非值班静默</span>
        </div>
      </div>

      <div id="extraDutyCapsule" class="glass-capsule capsule-extra is-hidden">
        <span class="extra-spark" aria-hidden="true"></span>
        <span id="extraDutyBadgeText" class="capsule-primary">额外晚班</span>
      </div>
    </section>

    <footer class="bottom-dock">
      <button id="btnExtraDuty" class="duty-cta" type="button" data-active="false">
        <span class="duty-cta-dot" aria-hidden="true"></span>
        <span id="btnExtraDutyText">今日额外值班</span>
      </button>
      <p id="subStatusHint" class="sub-hint"></p>
    </footer>
  </main>

  <!-- Extra Duty / Substitute Picker Drawer (16:30+) -->
  <div id="overrideModal" class="modal-backdrop is-hidden" role="dialog" aria-modal="true" aria-labelledby="overrideModalTitle">
    <div class="glass-sheet sheet-compact">
      <div class="sheet-header">
        <div>
          <h2 id="overrideModalTitle" class="sheet-title">开启今日额外晚班</h2>
          <p class="sheet-subtitle">16:30 – 23:59 · 选择本次接单人，将立即三端同步并布防哨兵</p>
        </div>
        <button id="btnCloseOverride" class="close-btn" type="button" aria-label="关闭"><span aria-hidden="true">&times;</span></button>
      </div>

      <div class="sheet-body">
        <div class="picker-section">
          <span class="field-label">本人值班</span>
          <button id="btnPickSelf" class="pick-chip pick-chip-self is-selected" type="button" data-engineer="">
            <span class="pick-chip-title">我自己</span>
            <span id="pickSelfHint" class="pick-chip-sub">不指定替班同事</span>
          </button>
        </div>

        <div class="picker-section">
          <div class="field-label-row">
            <span class="field-label">替班同事（来自排班同步）</span>
            <span id="colleagueCount" class="field-meta">0 人</span>
          </div>
          <div id="colleagueList" class="colleague-grid"></div>
          <p id="colleagueEmpty" class="empty-tip is-hidden">暂未同步同事名单，可在下方手动输入姓名</p>
        </div>

        <div class="picker-section">
          <label class="field-label" for="manualEngineerInput">手动输入姓名兜底（留空则按上方选择）</label>
          <input id="manualEngineerInput" class="glass-input" type="text" placeholder="例如：张三（精确匹配姓名）" autocomplete="off" spellcheck="false">
        </div>
      </div>

      <div class="sheet-footer">
        <button id="btnCancelOverride" class="btn-secondary" type="button">取消</button>
        <button id="btnConfirmOverride" class="btn-primary" type="button">确认开启并同步</button>
      </div>
    </div>
  </div>

  <!-- Settings & Recent Logs Modal -->
  <div id="settingsModal" class="modal-backdrop is-hidden" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="glass-sheet sheet-wide">
      <div class="sheet-header">
        <div>
          <h2 id="settingsModalTitle" class="sheet-title">连接设置与状态日志</h2>
          <p class="sheet-subtitle">配置仅保存在本机浏览器 localStorage，绝不上传第三方服务器</p>
        </div>
        <button id="btnCloseSettings" class="close-btn" type="button" aria-label="关闭"><span aria-hidden="true">&times;</span></button>
      </div>

      <div class="settings-layout">
        <div class="settings-col">
          <div class="import-box">
            <label class="field-label" for="configCodeInput">一键粘贴配置码（推荐）</label>
            <textarea id="configCodeInput" class="glass-textarea" rows="3" placeholder="粘贴 GDC_SENTINEL:eyJ3c3NVcmwiOi..."></textarea>
            <div class="inline-actions">
              <button id="btnImportCode" class="btn-accent" type="button">解析并保存</button>
              <button id="btnExportCode" class="btn-secondary" type="button">生成并复制配置码</button>
            </div>
          </div>

          <form id="settingsForm" class="settings-form" autocomplete="off">
            <div class="form-row">
              <label class="field-label" for="inputWssUrl">MQTT WSS 地址 (wssUrl)</label>
              <input id="inputWssUrl" class="glass-input" type="url" placeholder="wss://your-broker.emqx.cloud:8084/mqtt" spellcheck="false">
            </div>

            <div class="form-grid-2">
              <div class="form-row">
                <label class="field-label" for="inputUsername">用户名 (username)</label>
                <input id="inputUsername" class="glass-input" type="text" placeholder="可选" spellcheck="false">
              </div>
              <div class="form-row">
                <label class="field-label" for="inputPassword">密码 (password)</label>
                <input id="inputPassword" class="glass-input" type="password" placeholder="可选" spellcheck="false">
              </div>
            </div>

            <div class="form-row">
              <label class="field-label" for="inputTopicPrefix">Topic 前缀 (topicPrefix)</label>
              <input id="inputTopicPrefix" class="glass-input" type="text" placeholder="gdc_wa/default" spellcheck="false">
            </div>

            <div class="form-row">
              <label class="field-label" for="inputBarkUrl">Bark 推送地址 (barkUrl)</label>
              <input id="inputBarkUrl" class="glass-input" type="url" placeholder="https://api.day.app/你的Key/" spellcheck="false">
            </div>

            <div class="inline-actions form-actions">
              <button id="btnSaveSettings" class="btn-primary" type="submit">保存并连接</button>
              <button id="btnClearConfig" class="btn-danger-ghost" type="button">清空配置</button>
            </div>
          </form>
        </div>

        <div class="settings-col settings-col-logs">
          <div class="meta-cards">
            <div class="meta-item">
              <span class="meta-k">Client ID</span>
              <span id="metaClientId" class="meta-v mono">--</span>
            </div>
            <div class="meta-item">
              <span class="meta-k">排班缓存</span>
              <span id="metaScheduleInfo" class="meta-v">尚未同步</span>
            </div>
            <div class="meta-item">
              <span class="meta-k">屏幕防息屏</span>
              <span id="metaWakeLock" class="meta-v">检测中</span>
            </div>
          </div>

          <div class="log-header">
            <span class="field-label">最近状态日志（最多 20 条）</span>
            <button id="btnClearLogs" class="link-btn" type="button">清空</button>
          </div>
          <ul id="logList" class="log-list" aria-live="polite"></ul>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast is-hidden" role="status" aria-live="polite"></div>
  <audio id="alertAudio" src="./assets/alert.wav" preload="auto" aria-hidden="true"></audio>

  <script src="./vendor/mqtt.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
