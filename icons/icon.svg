<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#13223b"/>
      <stop offset="55%" stop-color="#09111f"/>
      <stop offset="100%" stop-color="#04070e"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(165, 224, 255, 0.72)"/>
      <stop offset="50%" stop-color="rgba(78, 173, 255, 0.22)"/>
      <stop offset="100%" stop-color="rgba(48, 224, 152, 0.55)"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38e59b" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#38e59b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38e59b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="168" fill="rgba(255,255,255,0.035)" stroke="url(#ring)" stroke-width="6"/>
  <circle cx="256" cy="256" r="126" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="2" stroke-dasharray="6 10"/>
  <!-- Clock ticks -->
  <g stroke="rgba(235,244,255,0.5)" stroke-width="5" stroke-linecap="round">
    <line x1="256" y1="108" x2="256" y2="128"/>
    <line x1="256" y1="384" x2="256" y2="404"/>
    <line x1="108" y1="256" x2="128" y2="256"/>
    <line x1="384" y1="256" x2="404" y2="256"/>
  </g>
  <!-- Hands -->
  <line x1="256" y1="256" x2="256" y2="164" stroke="#eef6ff" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="326" y2="294" stroke="#7cc6ff" stroke-width="8" stroke-linecap="round"/>
  <!-- Sentinel Pulse Core -->
  <circle cx="256" cy="256" r="40" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="14" fill="#46f0a5" stroke="#06111c" stroke-width="4"/>
</svg>
